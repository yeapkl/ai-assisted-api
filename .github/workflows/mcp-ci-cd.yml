name: MCP Server CI/CD

on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp-server/**"
      - ".github/workflows/mcp-ci-cd.yml"

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: mcp-server/pom.xml

      - name: Build and run tests
        working-directory: mcp-server
        run: mvn -B verify

  docker-publish:
    name: Build & push Docker image
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-mcp-server
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mcp-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cloud-run:
    name: Deploy to Cloud Run (test environment)
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    environment:
      name: gcp-test
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # Reuses the same WIF trust + deployer identity set up for the main
      # API's deploy job (docs/deploy/gcp-cloud-run-setup.md) - roles/run.admin
      # is project-scoped, so no additional GCP setup is needed for this
      # second service.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: us-central1
          service: hello-world-mcp-server
          image: ghcr.io/${{ github.repository }}-mcp-server:sha-${{ github.sha }}
          env_vars: |-
            API_BASE_URL=https://hello-world-api-mz5e3hbozq-uc.a.run.app
            OAUTH_ISSUER_URI=https://hello-world-api-mz5e3hbozq-uc.a.run.app
            MCP_RESOURCE_AUDIENCE=mcp-server
            MCP_SERVER_BASE_URL=${{ steps.deploy.outputs.url }}
          # No secrets: this service holds no credentials of its own - it
          # validates OAuth access tokens issued by hello-world-api's
          # Authorization Server, but never issues or stores one itself.
          # --allow-unauthenticated: per the confirmed product decision
          # (docs/requirements/mcp-server.md §5, Assumption 3), the OAuth
          # 2.1 resource-server check (see com.apitest.mcp.security) is now
          # the sole authorization boundary at the application layer -
          # check_api_health/register_user need no token at all, and
          # get_hello_greeting independently validates a real,
          # audience-scoped Bearer token per request. Keeping the GCP IAM
          # gate on top would make this service unreachable by any standard
          # MCP client, which don't know how to mint a GCP identity token.
          flags: --port=8080 --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }} --allow-unauthenticated

      - name: Smoke test the deployment (unauthenticated)
        run: |
          # check_api_health needs no Authorization header at all (NFR-7) -
          # no GCP identity token to mint now that this service is
          # --allow-unauthenticated; the OAuth resource-server check (not
          # GCP IAM) is what protects get_hello_greeting instead.
          curl -sf -X POST "${{ steps.deploy.outputs.url }}/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | tee /dev/stderr | grep -q '"register_user"'
          curl -sf "${{ steps.deploy.outputs.url }}/.well-known/oauth-protected-resource" \
            | tee /dev/stderr | grep -q '"authorization_servers"'
