server:
  port: ${PORT:8000}

spring:
  application:
    name: hello-world-api
  # We answer validation failures ourselves (422, see GlobalExceptionHandler),
  # so we don't need Spring's default MVC problem-detail responses.
  mvc:
    problemdetails:
      enabled: false
    # Bug fix: without this, DispatcherServlet silently delegates unmapped
    # requests to the default static-resource handler instead of raising an
    # exception, which (combined with resources.add-mappings below) is what
    # let a request to a nonexistent route fall through to the generic
    # Exception handler and return 500 instead of 404.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      # Disable the default "/**" static resource handler mapping so that an
      # unmapped route actually reaches DispatcherServlet's "no handler
      # found" path (see throw-exception-if-no-handler-found above) instead
      # of being swallowed by ResourceHttpRequestHandler.
      add-mappings: false

# App-specific, environment-driven configuration (NFR-2). Same env var names
# as the pre-Spring-Boot implementation: JWT_SECRET_KEY, ACCESS_TOKEN_EXPIRE_MINUTES,
# REFRESH_TOKEN_EXPIRE_DAYS, APP_ENV, CORS_ALLOWED_ORIGINS. Bound into
# config.AppProperties, which fails fast at startup if JWT_SECRET_KEY is
# missing or under 32 characters — same behavior as the old Config.java.
app:
  jwt-secret-key: ${JWT_SECRET_KEY:}
  access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:15}
  refresh-token-expire-days: ${REFRESH_TOKEN_EXPIRE_DAYS:7}
  app-env: ${APP_ENV:development}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    # NFR-5: off by default. Only set to true if this app is deployed behind
    # a trusted reverse proxy that itself sets/overwrites X-Forwarded-For
    # (never passing through a client-supplied value unmodified). With no
    # such proxy documented for this deployment, X-Forwarded-For is
    # client-controlled and must not be trusted for rate-limit keying -
    # RateLimitFilter falls back to request.getRemoteAddr() when this is false.
    trust-x-forwarded-for: ${RATE_LIMIT_TRUST_X_FORWARDED_FOR:false}
  # OAuth 2.1 Authorization Server (NFR-13..NFR-20), additive - see
  # com.apitest.oauth.OAuthProperties. Same "env var, fail fast if
  # missing/short" posture as JWT_SECRET_KEY above.
  oauth:
    issuer: ${OAUTH_ISSUER:http://localhost:8000}
    client-id: ${MCP_OAUTH_CLIENT_ID:mcp-server}
    client-secret: ${MCP_OAUTH_CLIENT_SECRET:}
    redirect-uris: ${MCP_OAUTH_REDIRECT_URIS:http://127.0.0.1:8765/callback}
    resource-audience: ${MCP_OAUTH_RESOURCE_AUDIENCE:mcp-server}
    # This app's own resource identifier - ALWAYS additionally stamped onto
    # every issued token on top of resource-audience above, regardless of
    # that value (QA-flagged gap fix, 2026-09-21) - see
    # OAuthProperties#getSelfAudience() Javadoc for the full reasoning.
    self-audience: ${OAUTH_SELF_AUDIENCE:hello-world-api}
    signing-key-secret: ${OAUTH_SIGNING_KEY_SECRET:}
    # Separate token-lifetime config surface from app.access-token-expire-minutes
    # / app.refresh-token-expire-days above (see OAuthProperties Javadoc) -
    # same 15-minute/7-day defaults (NFR-3's intent), different token family.
    access-token-expire-minutes: ${OAUTH_ACCESS_TOKEN_EXPIRE_MINUTES:15}
    refresh-token-expire-days: ${OAUTH_REFRESH_TOKEN_EXPIRE_DAYS:7}

logging:
  level:
    # NFR-9: never log request/response bodies (which would include passwords
    # and tokens) — keep Spring MVC/Security logging at default (no DEBUG
    # payload logging) in every environment.
    root: INFO
